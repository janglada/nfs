/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://download.dcache.org/nexus/content/repositories/releases/')
    }

    maven {
        url = uri('https://download.oracle.com/maven/')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.dcache.nfs4j.core
    api libs.org.dcache.oncrpc4j.core
    api libs.com.github.ben.manes.caffeine.caffeine
    api libs.org.slf4j.slf4j.api
    runtimeOnly libs.org.slf4j.slf4j.simple
    testImplementation libs.org.junit.jupiter.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation libs.org.mockito.mockito.core
    testImplementation libs.com.h2database.h2
}

group = 'org.example'
version = '1.0.0-SNAPSHOT'
description = 'NFS4J Server — No Spring, Caffeine, JDK 25'
java.sourceCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
